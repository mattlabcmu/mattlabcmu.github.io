{% assign hero_collage = false %}
{% unless page.hero_image %}
    {% assign hero_collage = true %}
{% endunless %}
<section
    class="hero {% if page.hero_height %} {{ page.hero_height }} {% else %} is-medium {% endif %} is-bold {% if hero_collage %}hero-collage{% else %}is-primary{% endif %}"
    {% if page.hero_image %}
        style="background: url('{{ page.hero_image }}') no-repeat center center; background-size: cover;"
    {% endif %}
>
    {% if hero_collage %}
    <div class="hero-collage-art" aria-hidden="true">
        <img class="hero-collage-img is-1" src="{{ '/img/header/IMG_5418.jpg' | relative_url }}" alt="">
        <img class="hero-collage-img is-2" src="{{ '/img/header/IMG_5475.jpg' | relative_url }}" alt="">
        <img class="hero-collage-img is-3" src="{{ '/img/header/distributed_convoy.jpg' | relative_url }}" alt="">
        <img class="hero-collage-img is-4" src="{{ '/img/header/mmpug_hero.jpg' | relative_url }}" alt="">
        <img class="hero-collage-img is-5" src="{{ '/img/header/IMG_2717.jpg' | relative_url }}" alt="">
    </div>
    <div class="hero-collage-shade"></div>
    {% endif %}
    <div class="hero-body {% if page.hero_darken %} hero-darken {% endif %}">
        <div class="container">
            <h1 class="title is-2">{{ page.title }}</h1>
            <p class="subtitle is-3">{{ page.subtitle }}</p>
            {% if page.hero_link %}
                <div class="my-4">
                    <a href="{{ page.hero_link | relative_url }}" class="button is-info is-large">
                        {{- page.hero_link_text -}}
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</section>
